query GetPdpDataById(
  $id: String!
  $category: String! = ""
  $unifiedId: String! = ""
  $locale: String
  $fetchPcmMedia: Boolean!
  $fetchVariants: Boolean!
) {
  productDetailPage(
    id: $id
    category: $category
    unifiedId: $unifiedId
    locale: $locale
  ) {
    allInseam {
      productId
      productUrl
      inseam
    }
    allLocalePids {
      CA
      US
      siteId
      pdpUrl
      categoryUnifiedId
      productUnifiedId
    }
    allSize {
      size
      available
    }
    category {
      id
      name
    }
    colorDriver {
      color
      sizes
    }
    colorAttributes {
      colorId
      styleColorId
      wwmt
      fabricPill
      colorGroups
      designedFor {
        activityText
        iconId
      }
      careAndContent {
        iconId
        title
        sections {
          media
          title
          attributes {
            badgeId
            badgeText
            iconId
            list {
              items
              title
            }
            text
          }
        }
      }
      fabricOrBenefits {
        iconId
        title
        sections {
          media {
            captionText
            imageAlt
            videoSrcPortrait
            videoPosterSrc
            videoPosterSrcPortrait
            imageSrc
            videoSrc
          }
          title
          attributes {
            iconId
            list
            text
            attributeType
          }
        }
      }
      fitOrHowToUse {
        id
        iconId
        title
        sections {
          media {
            captionText
            imageAlt
            videoSrcPortrait
            videoPosterSrc
            videoPosterSrcPortrait
            imageSrc
            videoSrc
          }
          title
          attributes {
            iconId
            list
            text
            attributeType
          }
        }
      }
      featuresOrIngredients {
        id
        iconId
        title
        sections {
          media {
            captionText
            imageAlt
            videoSrcPortrait
            videoPosterSrc
            videoPosterSrcPortrait
            imageSrc
            videoSrc
          }
          title
          attributes {
            iconId
            list
            text
            attributeType
          }
        }
      }
    }
    colors {
      code
      name
      swatchUrl
      slug
      simpleRanking
      ituBt709
      ituBt601
      colorHarmonyRank
    }
    highlights {
      highlightIconWeb
      highlightLabel
      visibility
      subText
      abFlag {
        name
        abFlagName
        showIcon
        showSubText
        showHighlight
        visibility
      }
    }
    pcmProductStyleInfo @include(if: $fetchPcmMedia) {
      departmentId
      divisionId
    }
    pcmProductVideoInfo {
      type
      url
      posterImageUrl
    }
    productAttributes {
      productContentCare {
        colorId
        heroBannerHotSpotText
        care {
          careId
          careDescription
          iconImgUrl
        }
      }
      productContentFeature {
        f5ContentAlignmentPDP
        styleId
        f5Features {
          featureName
          featureDescription
        }
      }
      productContentFabric {
        fabricDescription
        fabricDisplayName
        fabricId
        fabricPurposes
      }
      productContentWhyWeMadeThis
    }
    productCarousel {
      color {
        code
        name
        swatchUrl
        slug
        simpleRanking
        ituBt709
        ituBt601
        colorHarmonyRank
      }
      modelInfo {
        description
        modelIsWearing {
          productName
          numberOfAvailableColors
          url
          imageURL
          onSale
          listPrice
          salePrice
        }
        shopThisLook
      }
      imageInfo
      inseam
      mediaInfo {
        type
        url
        posterImageUrl
      }
      pcmMediaInfo @include(if: $fetchPcmMedia) {
        type
        url
        posterImageUrl
      }
    }
    productSummary {
      productId
      displayName
      unifiedId
      parentCategoryUnifiedId
      pdpUrl
      pdpUrlWithRegion
      productUrl
      shareUrl
      whyWeMadeThis
      isFinalSale
      isSoldOut
      isLoyaltyProduct
      isHazmatProduct
      divisionId
      featuredFabric
      fitDetails
      departmentId

      activity
      allAncestorsDisplayName
      allAncestorsRepositoryId
      allAvailableSizes
      bazaarVoiceID
      collections
      colorGroup
      colour
      commonId
      currencyCode
      defaultParentCategory
      defaultSku
      display
      displayCA
      displayNameWithBr
      f5BckimgUrl
      freeReturnShipping
      gender
      genderCategoryTitle
      genderCategoryProductTitle
      hasLinkedProducts
      imageScheme
      isDisplayable
      isProductLocaleMatch
      itemType
      linkedProducts
      listPrice
      locale
      loyaltyTermsAndConditions {
        url
        text
      }
      onSale
      parentCategoryDisplayName
      parentCategoryKeywords
      price
      priceRange
      productActivityIdRepositoryId
      productApplicableSystems
      productBaseUrl
      productCatalogId
      productCategory
      productDefaultSort
      productDisallowAsRecommendation
      productHasOutfitProduct
      productLanguage
      productLastSkuAdditionDateTime
      productMarkDown
      productName
      productNoFollow
      productNoIndex
      productNumberOfImageAssets
      productOnSale
      productSiteMapPdpUrl
      productSizes
      productWhatsNew
      skuSkuImages
      skuStyleOrder
      title
      trendingColorsAll
      topSellers
      type
      newColors
    }
    productVariants {
      attributeType
      colorCode
      description
      fabric
      fit
      imageUrl
      label
      name
      path
      productId
      type
      value
    }
    refinementCrumbs {
      displayName
      dimensionName
      label
      multiSelect
      properties {
        navigationState
        nValue
      }
      ancestors {
        label
        navigationState
        properties {
          navigationState
          nValue
        }
      }
    }
    seoData {
      id
      type
      attributes {
        title
        description
        h1
        canonical
        robots
        href_langs {
          type
          id
          attributes {
            href
            rel
          }
        }
      }
    }
    sizeDriver {
      size
      colors
    }
    sizeGuide {
      url
      category
    }
    skus {
      id
      skuUrl
      price {
        listPrice
        currency {
          code
          symbol
        }
        onSale
        salePrice
        earlyAccessMarkdownPrice
      }
      size
      color {
        code
        name
        swatchUrl
        slug
        simpleRanking
        ituBt709
        ituBt601
        colorHarmonyRank
      }
      available
      inseam
      styleId
      styleNumber
    }
    tier
    variants @include(if: $fetchVariants) {
      color {
        code
        name
        swatchUrl
        slug
        simpleRanking
        ituBt709
        ituBt601
        colorHarmonyRank
      }
      skus {
        id
        skuUrl
        price {
          listPrice
          currency {
            code
            symbol
          }
          onSale
          salePrice
          earlyAccessMarkdownPrice
        }
        size
        color {
          code
          name
          swatchUrl
          slug
          simpleRanking
          ituBt709
          ituBt601
          colorHarmonyRank
        }
        available
        inseam
        styleId
        styleNumber
      }
      imageSet {
        images {
          url
          alt
        }
        modelDescription
      }
    }
    whyWeMadeThisAttributes {
      text
      image
    }
  }
}
